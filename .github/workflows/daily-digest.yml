name: Daily Florida cannabis digest

on:
  schedule:
    # 10:15 UTC = 6:15 AM Eastern in summer, 5:15 AM in winter.
    # GitHub sometimes starts scheduled runs 10-30 minutes late.
    - cron: "15 10 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button so you can run it any time

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python agent.py

      - name: Save today's results and website
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data docs
          git commit -m "Daily digest $(date +%F)" || echo "Nothing changed"
          git push
